<svg width="700" height="430" viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="700" height="116" rx="10" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><text x="24" y="36" font-size="19" fill="#0E3F8C">① 单元测试 · cargo test</text><text x="24" y="66" font-size="16" fill="#4A5568">覆盖 POST 报文送达、自定义请求头、YAML 合并优先级</text><text x="24" y="90" font-size="16" fill="#4A5568">状态码分布、纳秒分位数单调性、Semaphore 上限、空统计兜底</text><line x1="576" y1="20" x2="576" y2="96" stroke="#E5E7EB" stroke-width="1" /><text x="600" y="64" font-size="26" fill="#1E4FA8">25/25</text><text x="600" y="88" font-size="14" fill="#8B97A8">单测通过</text><rect x="0" y="136" width="700" height="116" rx="10" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><text x="24" y="172" font-size="19" fill="#0E3F8C">② 基准测试 · cargo bench</text><text x="24" y="202" font-size="16" fill="#4A5568">两个 bench 目标直接调用 lib target 里的真实实现</text><text x="24" y="226" font-size="16" fill="#4A5568">cargo bench --no-run 已通过编译验证，可作回归基线</text><line x1="576" y1="156" x2="576" y2="232" stroke="#E5E7EB" stroke-width="1" /><text x="600" y="200" font-size="26" fill="#1E4FA8">4 档</text><text x="600" y="224" font-size="14" fill="#8B97A8">QPS 覆盖</text><rect x="0" y="272" width="700" height="116" rx="10" fill="#F0F5FC" stroke="#D6E4F5" stroke-width="1" /><text x="24" y="308" font-size="19" fill="#0E3F8C">③ 流水线守门 · --p99-threshold</text><text x="24" y="338" font-size="16" fill="#4A5568">p99 超阈值即以退出码 2 结束，交给流水线自动判断</text><text x="24" y="362" font-size="16" fill="#4A5568">命令行与 YAML 三层合并，命令行显式参数优先</text><line x1="576" y1="292" x2="576" y2="368" stroke="#D6E4F5" stroke-width="1" /><text x="600" y="336" font-size="26" fill="#D9534F">2</text><text x="600" y="360" font-size="14" fill="#8B97A8">不达标退出码</text><text x="350" y="414" text-anchor="middle" font-size="18" fill="#4A5568">三层各管一件事：行为对不对、开销大不大、底线守不守得住</text></svg>