<svg width="650" height="400" viewBox="0 0 650 400" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="8" width="270" height="54" rx="8" fill="#E8EFF8" stroke="#C9DDF6" stroke-width="1" /><text x="175" y="42" text-anchor="middle" font-size="18" fill="#1E4FA8">① 加锁并 refill()</text><line x1="175" y1="62" x2="175" y2="92" stroke="#3D7BD9" stroke-width="2" /><polygon points="175,96 170,86 180,86" fill="#3D7BD9" /><rect x="40" y="96" width="270" height="54" rx="8" fill="#E8EFF8" stroke="#C9DDF6" stroke-width="1" /><text x="175" y="130" text-anchor="middle" font-size="18" fill="#1E4FA8">② tokens ≥ 1 ？</text><line x1="310" y1="123" x2="366" y2="123" stroke="#3D7BD9" stroke-width="2" /><polygon points="370,123 360,118 360,128" fill="#3D7BD9" /><text x="338" y="113" text-anchor="middle" font-size="16" fill="#3D7BD9">是</text><rect x="370" y="96" width="250" height="54" rx="8" fill="#DCE9F8" stroke="#B8D2F2" stroke-width="1" /><text x="495" y="130" text-anchor="middle" font-size="18" fill="#1E4FA8">扣 1 个令牌 · 立即放行</text><line x1="175" y1="150" x2="175" y2="178" stroke="#D9534F" stroke-width="2" /><polygon points="175,182 170,172 180,172" fill="#D9534F" /><text x="190" y="172" font-size="16" fill="#D9534F">否</text><rect x="40" y="184" width="270" height="76" rx="8" fill="#FDF0EF" stroke="#E8B4B1" stroke-width="1" /><text x="175" y="216" text-anchor="middle" font-size="18" fill="#D9534F">需等待 (1 − tokens) / rate</text><text x="175" y="244" text-anchor="middle" font-size="18" fill="#D9534F">再补 1 ms 余量</text><line x1="175" y1="260" x2="175" y2="290" stroke="#3D7BD9" stroke-width="2" /><polygon points="175,294 170,284 180,284" fill="#3D7BD9" /><rect x="40" y="294" width="270" height="54" rx="8" fill="#E8EFF8" stroke="#C9DDF6" stroke-width="1" /><text x="175" y="328" text-anchor="middle" font-size="18" fill="#1E4FA8">④ 释放锁 · sleep 后重试</text><path d="M175 348 L175 378 L20 378 L20 35 L36 35" fill="none" stroke="#3D7BD9" stroke-width="2" /><polygon points="40,35 30,30 30,40" fill="#3D7BD