[package]
name = "loadtester"
version = "0.1.0"
edition = "2021"
description = "Rust HTTP 压测工具（MVP 骨架）"
license = "MIT"

[[bin]]
name = "loadtester"
path = "src/main.rs"

# 关闭默认特性，避免过大的 debug 体积与冗余依赖
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true

[dependencies]
# 异步运行时：多线程 + full 特性，避免后续反复补 feature
tokio = { version = "1.40", features = ["full"] }

# HTTP 客户端：使用 rustls 而不是默认 native-tls，避免原生 OpenSSL 依赖
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "http2",
  "json",
  "stream",
] }

# HTTP 底层实现（由 reqwest 传递引入，这里显式声明以便后续直接使用其类型）
hyper = { version = "1.0", default-features = false }

# CLI 参数解析
clap = { version = "4.5", features = ["derive", "cargo"] }

# 序列化：配置解析、JSON 导出
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# 延迟分布统计
hdrhistogram = "7.5"

# 进度条（终端 UI）
indicatif = "0.17"

# 数据集随机化用随机数（后续第 4 周接入）
rand = "0.8"

# CSV 导出
csv = "1.3"

# 统一错误处理
anyhow = "1.0"

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
criterion = { version = "0.5", features = ["html_reports"] }

# 基准测试目标：统计引擎（record / summarize）与限流器（TokenBucket::acquire）
[[bench]]
name = "stats"
path = "benches/stats_bench.rs"
harness = false

[[bench]]
name = "worker"
path = "benches/worker_bench.rs"
harness = false